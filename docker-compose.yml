# ============================================================
# 笔记系统编排
#
# 安全约定（重要）：
#   只有 nginx 对外暴露端口，postgres / backend 一律不映射到宿主机，
#   仅在 compose 内部网络互通，避免数据库和 API 直接暴露在局域网/公网。
#   远程访问请用 Cloudflare Tunnel / 反代指向 http://localhost:${APP_PORT}
# ============================================================
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD（可运行 ./scripts/gen-env.sh 自动生成）}
      POSTGRES_DB: ${POSTGRES_DB:-notes}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-notes}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-notes}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（可运行 ./scripts/gen-env.sh 自动生成）}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ICAL_TOKEN_TTL_DAYS: ${ICAL_TOKEN_TTL_DAYS:-90}
      PORT: "3000"
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
      TRUST_PROXY: ${TRUST_PROXY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      UPLOAD_DIR: /app/uploads
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # 只暴露这一个入口；改端口请改 .env 的 APP_PORT
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  uploads:
