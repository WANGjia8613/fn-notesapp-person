upstream backend_upstream {
    server backend:3000;
}

upstream frontend_upstream {
    server frontend:80;
}

# 后端要根据请求头拼对外绝对地址（邀请链接、日历订阅 URL）。
# 注意：nginx 的 $host 会把端口去掉，必须用 $http_host，
# 否则非 80 端口访问时生成的链接会缺端口（如 http://IP/register?...）。
# 协议优先用上游传入的 X-Forwarded-Proto（Cloudflare Tunnel 场景），否则用 $scheme。
map $http_x_forwarded_proto $proxy_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 附件签名下载 URL 里的 ?t= 是长期有效的能力凭证，绝不能落进 access log。
# nginx 默认的 combined 格式记的是 $request（含完整 query string），
# 这里自定义格式只记 $uri（路径），把 query 彻底排除。
# 排错时若需要看完整请求，用 docker compose logs nginx 看后端日志，而不是翻 access.log。
log_format notes_safe '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log notes_safe;

    # 与后端附件上限（50MB）对齐
    client_max_body_size 55m;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # 说明：HSTS 只在 HTTPS 接入层（Cloudflare / 反代）开启，这里不做

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- API ----------
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 附件上传/下载走流式，不缓冲到磁盘
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ---------- 前端静态资源 ----------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
